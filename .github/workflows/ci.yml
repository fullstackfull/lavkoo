name: CI

# Runs on every pull request, on pushes to main and on demand (Actions > CI > Run workflow, for any branch). Nothing here can reach a real
# provider, a real database or production: provider traffic is faked in the tests, the databases are throwaway.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless. A push to a branch is different: each one is scanned for secrets
  # from its own previous tip, so cancelling one would leave its commits unread.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_EXTENSIONS: curl, dom, fileinfo, gd, intl, json, libxml, mbstring, mysqli, openssl, pdo_mysql, pdo_sqlite, sqlite3, zip, bcmath, exif

jobs:
  # Is this change documentation ONLY? Four of the engine groups take between fifty minutes and the whole 110-minute ceiling, on two
  # engines each, and a pull request that rewrites one Markdown file under docs/ pays for all of them. The rule is in
  # scripts/ci/documentation-only-change.php rather than in a `paths-ignore:` here, for three reasons: `paths-ignore` would skip the
  # syntax check and the secret scan too, which must never be skipped; a skipped workflow and a workflow whose heavy jobs were skipped
  # read differently to anyone looking at the run; and a rule in a file can be TESTED, which tests/Unit/Ci/DocumentationOnlyChangeTest
  # does, down to asserting that every job starting a database carries the condition. The rule is deliberately one-sided: it answers
  # "documentation only" only when EVERY changed path is documentation, and anything it cannot read runs the whole suite.
  decide:
    name: What this change can affect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation_only: ${{ steps.scope.outputs.documentation_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge-base needs both sides; a shallow clone of the head alone cannot name what changed.
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Read the changed paths and ask whether they are documentation only
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          # Only a pull request has a base to compare with. A push to main, a dispatch of a branch and anything else answer `false`,
          # which runs everything: there is no safe way to tell what a dispatch is for.
          if [ -z "$BASE" ]; then
            echo "not a pull request: every job runs"
            echo "documentation_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE...HEAD" > /tmp/changed-paths.txt || { echo "the diff could not be read: every job runs"; echo "documentation_only=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "changed paths:"; cat /tmp/changed-paths.txt
          answer=$(php scripts/ci/documentation-only-change.php < /tmp/changed-paths.txt)
          echo "documentation only: $answer"
          echo "documentation_only=$answer" >> "$GITHUB_OUTPUT"

  lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file we own (catches syntax the oldest supported PHP cannot parse)
        run: |
          find app routes config database tests bootstrap Modules scripts -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n 50 -P 4 php -l > /tmp/lint.log 2>&1 || { grep -v '^No syntax errors' /tmp/lint.log; exit 1; }
          echo "all files parse"

  tests-sqlite:
    name: Tests, SQLite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # The whole suite took 14 minutes on one runner, 37 on another (run 293) and 45 minutes 16 seconds on a third (run 334, PHP 8.3, which this job's old ceiling of 45 minutes cancelled);
    # it has grown by about a thousand tests since. The ceiling is the one the MySQL sales-channel jobs already have.
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Environment (the example file carries a throwaway APP_KEY; no secret is used)
        run: cp .env.example .env
      - name: strace (a deployment-tooling test watches the order in which a rollback restores and deletes)
        run: sudo apt-get install -y --no-install-recommends strace
      - name: Full test suite
        env:
          EXPECT_DB_DRIVER: sqlite
        run: vendor/bin/phpunit --display-skipped
      - name: Deployment tooling once more as root (the tests of file ownership need it; the rest run as the user a server would use)
        if: matrix.php == '8.3'
        env:
          EXPECT_DB_DRIVER: sqlite
        run: sudo -E env "PATH=$PATH" vendor/bin/phpunit --display-skipped tests/Unit/Deploy

  # The engines: MySQL 8 and MariaDB 11.4.2 (the version the pilot server runs: docs/integrations/pilot-deployment.md), each with three sets of tests (the storefront set is small and runs the products migration on both engines), each job against its own
  # database: the address tests build their tables with the real migrations, which a real engine does slowly, and the two sets together ran past the limit of one job (about 35 minutes
  # on a runner; each set takes about 15 to 20). A MariaDB image answers to the MARIADB_* names; both sets are given so the same service block serves both.
  tests-mysql:
    name: ${{ matrix.group }}, ${{ matrix.engine }}
    needs: decide
    if: needs.decide.outputs.documentation_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: ['MySQL 8', 'MariaDB 11.4.2']
        group: ['Fulfillment + security tests', 'Address tests', 'Storefront tests', 'Catalog tests', 'Staff scope tests', 'Checkout, payment and permission tests', 'Saudi baseline pack', 'Report pagination tests', 'Notification and localization tests', 'Wallet tests', 'Marketplace and ledger tests', 'Marketing consent tests', 'Payment tests', 'Fulfillment, security and customer tests', 'Till stock tests']
        include:
          - engine: MySQL 8
            image: mysql:8.0
            version: '^8\.'
            health: mysqladmin ping -h 127.0.0.1 -pci-root-password
          - engine: MariaDB 11.4.2
            image: mariadb:11.4.2
            version: '^11\.4\.2-MariaDB'
            health: mariadb-admin ping -h 127.0.0.1 -uroot -pci-root-password
          - group: Fulfillment + security tests
            paths: tests/Unit/Fulfillment tests/Feature/Fulfillment tests/Feature/Security tests/Feature/Payments tests/Unit/Payments tests/Feature/CiDatabaseTest.php
          - group: Fulfillment, security and customer tests
            # tests/Feature/Customer is the customer's two money ledgers and what closing an account does to them: a money question, so it
            # is answered by a real engine and not only by SQLite. Its source scan (tests/Unit/Customer) reads text and touches no database.
            paths: tests/Unit/Fulfillment tests/Feature/Fulfillment tests/Feature/Security tests/Feature/Customer tests/Feature/CiDatabaseTest.php
          - group: Address tests
            paths: tests/Feature/Address
          - group: Storefront tests
            # Also the platform admin API tests: the SQL they run for orders, products and refund requests has to meet a real engine, MariaDB included.
            paths: tests/Unit/Storefront tests/Feature/Storefront tests/Feature/PlatformAdmin
          - group: Catalog tests
            # tests/Feature/Catalogue is the one-row price write: it belongs on a real engine for the same reason the rest of the
            # catalogue does, and it ran on SQLite alone until it was named here.
            paths: tests/Feature/Catalog tests/Feature/Catalogue
          - group: Staff scope tests
            paths: tests/Feature/StaffScope
          - group: Checkout, payment and permission tests
            # The directories the checkout, referral, refund, POS, coupon and permission pull requests add. They ran only on SQLite, which reads an unknown
            # double-quoted name as a string and accepts a bare GROUP BY; on MySQL 8 they gave 34 failures, all fixtures SQLite had hidden.
            # tests/Feature/Monitoring is the stock reconciler, which issues raw SELECTs of its own and locks the session read-only: both are engine behaviour.
            paths: tests/Feature/Api tests/Feature/Auth tests/Feature/Blog tests/Feature/Cart tests/Feature/Checkout tests/Feature/Coupon tests/Feature/Inventory tests/Feature/Marketplace tests/Feature/Monitoring tests/Feature/Payment tests/Feature/Payments tests/Feature/Permissions tests/Feature/Pos tests/Feature/Referral tests/Feature/Refund tests/Feature/Web tests/Unit/Architecture tests/Unit/Customer tests/Unit/Http tests/Unit/Marketplace tests/Unit/PlatformAdmin tests/Unit/Security tests/Unit/Utils tests/Unit/Wallet
          # The named gate of the Saudi store (master tracker M2-01): the golden answers of the checkout, recorded from main, on both real engines. The pack is also in the
          # Address group; this job is the one a branch protection rule can require by name.
          - group: Saudi baseline pack
            paths: tests/Feature/Address/SaudiGoldenResponsesTest.php
          - group: Report pagination tests
            paths: tests/Feature/Reports
          - group: Notification and localization tests
            paths: tests/Feature/Notifications tests/Feature/Retention tests/Feature/Localization
          # The wallet money paths build their schema by hand, so SQLite in memory (a fresh database per test)
          # cannot tell whether they hold on an engine that keeps the previous test's tables, and decimal
          # columns, collation and row order are decided by the engine the live platform runs on.
          - group: Wallet tests
            # Its own group, and it must stay one: Tests\Support\BuildsMarketAccountSchema starts from an empty database
            # (Schema::dropAllTables) on a real engine, so sharing a job's database with another suite would take that suite's
            # tables away. The per-market wallet and loyalty accounts live here too -- the unique key on (customer, market), the
            # row lock a credit is taken under, the ascii_bin market, DECIMAL(40,20) balances and the ALTER TABLE the expand
            # migration runs, none of which SQLite enforces. Their races are in tests/Feature/Concurrency.
            paths: tests/Feature/Wallet
          - group: Marketplace and ledger tests
            # Both sides of a merge wrote a `paths:` here. YAML keeps the LAST key of a mapping, so the first silently lost and
            # tests/Feature/Marketplace -- what this group exists for -- stopped running on a real engine from it. One key, the union.
            paths: tests/Feature/Marketplace tests/Unit/Storefront tests/Feature/Storefront
          - group: Marketing consent tests
            paths: tests/Feature/Marketing
          # The payment-start tests, which until now ran on SQLite only (the whole-suite job above) and
          # on no real engine. They are about money the gateway is asked for, and the figures they assert
          # come out of decimal columns and of a currency lookup, so they belong on an engine that stores
          # decimals the way the platform does. Its own group rather than appended to another: the two
          # existing groups each take 15 to 20 minutes against a 35-minute ceiling.
          - group: Payment tests
            paths: tests/Feature/Payments
          - group: Till stock tests
            # The three tills: the two panels, driven through their own place-order routes, and the seller app's, driven
            # through its controller action with the Request its API middleware leaves. On a real engine because what the sale now
            # rests on is engine behaviour: a conditional decrement whose affected-row count is the refusal, and a row lock
            # taken in id order. SQLite agreeing proves neither — its grammar compiles lockForUpdate to nothing at all, which
            # the lock-order test says in so many words and asserts the clause only where it exists.
            # CiDatabaseTest comes with it, as it does for the fulfillment group: if a configuration slip ran this group on
            # SQLite after all, the till tests would still pass and the group would be green and worthless.
            paths: tests/Feature/Pos tests/Feature/CiDatabaseTest.php
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: pharmacy_testing
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: pharmacy_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      EXPECT_DB_DRIVER: mysql
      EXPECT_DB_VERSION: ${{ matrix.version }}
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pharmacy_testing
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.3-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Environment
        run: cp .env.example .env
      - name: Tests against real MySQL (locks, unique keys, collation, JSON, decimals, timestamps)
        # -c phpunit.mysql.xml: phpunit.xml pins SQLite with <server> entries, which override this job's DB_* variables.
        run: vendor/bin/phpunit -c phpunit.mysql.xml ${{ matrix.paths }} --display-skipped

  # Refuses a pull request that changes or deletes an existing golden answer of the Saudi baseline pack (tests/Fixtures/SaudiGolden). It may add new ones. A change the owner
  # approved says so in the title of its pull request ([saudi-baseline-change]). The rule is the script's, which a test runs against real git histories.
  saudi-baseline-expectations:
    name: Saudi baseline expectations unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No existing golden answer is changed or deleted
        env:
          # The title goes through the environment, never through the shell text of the step.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/saudi-baseline-guard.sh

  # Refuses a change that adds a credential, a private key, an environment file, a database dump or the phone number or e-mail
  # address of what looks like a real person. It reads only the lines the change adds and never prints what it matched.
  leak-guard:
    name: No secret or personal data added
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Scan the lines this change adds
        run: php scripts/ci/leak-guard.php --base="${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}"

  # Builds exactly what would be deployed to the server (the added and modified files of this pull request, with the checksum of
  # each file's baseline version) so it can be downloaded, read and checked before anyone deploys anything. This job deploys nothing.
  build-overlay:
    name: Deployment overlay (artifact, deploys nothing)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's own head, not GitHub's temporary merge of it into the target branch: the package must say exactly
          # which commit was reviewed, and its content must not change because the target branch moved.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build the overlay from what the server runs to this pull request
        env:
          # The commit the pilot server's code corresponds to. After a deployment, set the repository variable PILOT_BASELINE to the
          # `head` recorded in the deployed package's MANIFEST.json, so the next package holds only what is new.
          BASELINE: ${{ vars.PILOT_BASELINE || '698aa1e' }}
          RELEASE: ${{ github.event.pull_request.head.sha }}
        run: php scripts/deploy/build-overlay.php --base="$BASELINE" --head="$RELEASE" --out=build/overlay --archive
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-overlay-${{ github.event.pull_request.head.sha }}
          path: |
            build/overlay.tar.gz
            build/overlay.tar.gz.sha256
          retention-days: 14

  # The sales-channel and operational-cost modules on a real MySQL. They are many (about 1,900 tests, each building its schema from the real migrations), so they run as their own job,
  # in two groups side by side, with a timeout of their own; the job above is left as the Fulfillment workstream set it up.
  tests-mysql-sales-channels:
    name: Sales-channel and cost tests, ${{ matrix.engine }} (${{ matrix.group }})
    needs: decide
    if: needs.decide.outputs.documentation_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        engine: ['MySQL 8.0', 'MariaDB 11.4.2']
        group: ['sales channels A-M', 'sales channels N-Z', 'concurrency', 'myfatoorah', 'costs']
        include:
          - engine: MySQL 8.0
            image: mysql:8.0
            version: '^8\.'
            health: mysqladmin ping -h 127.0.0.1 -pci-root-password
          - engine: MariaDB 11.4.2
            image: mariadb:11.4.2
            version: '^11\.4\.2-MariaDB'
            health: mariadb-admin ping -h 127.0.0.1 -uroot -pci-root-password
          # SPLIT IN TWO, for the third time this group has outgrown a runner's hour and a half. On the Amazon-feed branch
          # the MySQL 8.0 job ran from 01:05:27 to 02:55:43 -- **exactly the 110-minute ceiling** -- and was killed with
          # "Terminate orphan process: pid (php)". GitHub reports a job killed by its own timeout as CANCELLED, which is the
          # failure mode the comment below the concurrency group warns about: a slow suite looks exactly like a broken one.
          #
          # Split by the first letter of the test CLASS, with `--filter`, and the directory still handed to phpunit. Two
          # earlier attempts at this were wrong and are worth recording:
          #
          #  - By channel ("Amazon tests here, the rest there") is quietly unsafe: a new test file matching neither list
          #    would never run, on either engine, and nothing would say so. A test that never runs beats a test that fails.
          #  - By file glob (`SalesChannels/[A-M]*.php`) FAILED IMMEDIATELY: this directory holds three abstract base
          #    classes (`AdminPagesTestCase`, `AdminSalesChannelsTestCase`, `DispatchTestCase`), and phpunit given a file
          #    list tries to load each as a test and dies on the first abstract one -- "Class ... is abstract", 45 seconds in.
          #    Handing it the DIRECTORY lets its own discovery skip them, which is why the path stays.
          #
          # That the two halves cover the whole directory is asserted by `CiSalesChannelSplitCoversEveryTestTest`, from the class
          # names, so a class cannot fall between them and cannot land in both.
          #
          # This comment used to carry the two halves' test counts as well, and they are gone on purpose: they drifted every
          # time anyone added a test to the directory, they were already stale at the base of the branch that last refreshed
          # them, and a diff that bumps them reads as "+N for the tests I just added" while it is in fact also correcting a
          # much larger inherited error. The counts proved nothing the guard above does not prove. Measure a half when you
          # need its size; do not trust a number written here.
          - group: sales channels A-M
            paths: tests/Feature/SalesChannels --filter '/^Tests.Feature.SalesChannels.[A-M]/'
          - group: sales channels N-Z
            paths: tests/Feature/SalesChannels --filter '/^Tests.Feature.SalesChannels.[N-Z]/'
          - group: concurrency
            # Split out of the sales-channel group, with MyFatoorah below, because that group could no longer FINISH on MySQL.
            #
            # Measured across the branches: MariaDB did the whole group in about 40 minutes, while the MySQL 8.0 job reached
            # 105 minutes against a 110-minute ceiling and reported NOTHING. It is not a hang -- the costs group shows the same
            # ratio on the same two engines (11 minutes on MariaDB, 34 on MySQL) -- so this engine is several times slower at
            # this workload and three suites in one job had outgrown it.
            #
            # A job killed by its own timeout reports NO RESULT, which is worse than a failure: a slow suite then looks exactly
            # like a broken one, and the head never shows a complete answer however often CI is re-run.
            #
            # These tests start several PHP processes at the same instant against this database and skip on SQLite, so this job
            # is the only place they run at all -- the stock, shipment, return-decision and Odoo races included.
            #
            # The wallet and loyalty tests ride here: their row locks and their rollbacks only mean something on a real engine.
            # CiDatabaseTest makes a job that fell back to SQLite fail instead of skipping every race test in green.
            paths: tests/Feature/Concurrency tests/Feature/Wallet tests/Feature/Loyalty tests/Feature/CiDatabaseTest.php
          - group: myfatoorah
            # Its own job since PR #12. It used to ride along with the sales-channel group, and that group then reached the 110-minute ceiling on MySQL 8 and was cancelled:
            # the two suites had grown into more than one runner's hour and a half together (82 minutes on MariaDB for the same set). Nothing is skipped by splitting them —
            # the same tests run on the same two engines, in parallel instead of in series.
            #
            # It runs on a real server as well as on SQLite because three of its failures were visible only here: an `orders` table that outlived the test, a currency left
            # switched off by an earlier test, and REPEATABLE READ hiding a sibling's just-committed row from a plain SELECT.
            #
            # tests/*/Payments rides here too, and on a real engine deliberately: the per-company gateway accounts turn on a unique key over three text
            # columns, a payment is stamped with a decimal rate read back as text, and a confirmation is held by an insertOrIgnore on a unique key. None
            # of those three is a property of the code -- SQLite agreeing about a unique index over ascii_bin columns proves nothing about MySQL.
            paths: tests/Feature/MyFatoorah tests/Unit/MyFatoorah tests/Feature/Wallet tests/Feature/Payments tests/Unit/Payments
          - group: costs
            # tests/*/Accounting is the Odoo posting, which belongs with the cost ledger it reads from. It runs on a real engine
            # because its whole job is uniqueness: a NULL is never equal to another NULL in a unique index, so a mapping or a
            # reconciliation row that means "every channel" can only be kept single by a sentinel value the index can compare --
            # and that is a property of the engine, not of the code, so SQLite agreeing proves nothing about MySQL.
            #
            # tests/Feature/Marketplace is the commission snapshot and the vendor ledger, and it is here for the same reason:
            # the snapshot is kept single per order line by a UNIQUE index on `order_details_id` -- the writer's idempotency
            # inside a retried order transaction rests on it -- its money is decimal(16,4), and the earning and its commission
            # charge are asserted to carry the SAME `available_at`, which is a DATETIME compared for equality. Uniqueness,
            # decimal rounding and timestamp equality are properties of the engine, so SQLite agreeing proves nothing about
            # MySQL. It was in no real-engine group before, and the whole suite on SQLite was the only place it ran.
            paths: tests/Feature/OperationalCosts tests/Unit/OperationalCosts tests/Unit/SalesChannels tests/Unit/Accounting tests/Feature/Accounting tests/Feature/Marketplace tests/Feature/CiDatabaseTest.php
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: pharmacy_testing
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: pharmacy_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      EXPECT_DB_DRIVER: mysql
      EXPECT_DB_VERSION: ${{ matrix.version }}
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pharmacy_testing
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.3-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Environment
        run: cp .env.example .env
      - name: Tests against real MySQL (unique keys, locks, JSON key order, collation, decimals, dates)
        # -c phpunit.mysql.xml: phpunit.xml pins SQLite with <server> entries, which override this job's DB_* variables.
        run: vendor/bin/phpunit -c phpunit.mysql.xml ${{ matrix.paths }} --display-skipped

  # The application's own connection is not strict (config/database.php), so a value strict mode would refuse can pass in production unnoticed. The tests run on the server's
  # MariaDB with the test connection in strict mode (DB_STRICT_TESTS=1: tests/CreatesApplication.php), which proves the new code writes nothing strict mode would refuse.
  tests-strict-mode:
    name: Strict-mode tests, MariaDB 11.4.2
    needs: decide
    if: needs.decide.outputs.documentation_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    services:
      mysql:
        image: mariadb:11.4.2
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: pharmacy_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      EXPECT_DB_DRIVER: mysql
      EXPECT_DB_VERSION: '^11\.4\.2-MariaDB'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pharmacy_testing
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      DB_STRICT_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.3-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Environment
        run: cp .env.example .env
      - name: Tests with the database connection in strict mode
        # FOUR merges each wrote their own `run:` here. YAML keeps the LAST key of a mapping, so this gate silently ran only
        # StrictModeTest, SalesChannels, OperationalCosts, Unit/Fulfillment, Fulfillment and Customer -- Wallet, Loyalty, Marketing,
        # Marketplace, Payments, Pos, Refund, Web and fourteen more were being skipped in strict mode altogether. One key, the union
        # of all four, with tests/Feature/Wallet LAST because it starts from an empty database and anything after it would find its
        # own tables gone.
        run: vendor/bin/phpunit -c phpunit.mysql.xml tests/Feature/StrictModeTest.php tests/Feature/SalesChannels tests/Feature/OperationalCosts tests/Unit/Fulfillment tests/Feature/Fulfillment tests/Feature/Customer tests/Feature/Marketing tests/Feature/Loyalty tests/Feature/Api tests/Feature/Auth tests/Feature/Blog tests/Feature/Cart tests/Feature/Checkout tests/Feature/Coupon tests/Feature/Inventory tests/Feature/Marketplace tests/Feature/Monitoring tests/Feature/Payment tests/Feature/Payments tests/Feature/Permissions tests/Feature/Pos tests/Feature/Referral tests/Feature/Refund tests/Feature/Web tests/Unit/Architecture tests/Unit/Customer tests/Unit/Http tests/Unit/Marketplace tests/Unit/PlatformAdmin tests/Unit/Security tests/Unit/Utils tests/Unit/Wallet tests/Feature/Catalog tests/Feature/Catalogue --display-skipped

  tests-strict-mode-wallet:
    name: Strict-mode wallet tests, MariaDB 11.4.2
    needs: decide
    if: needs.decide.outputs.documentation_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mariadb:11.4.2
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: pharmacy_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      EXPECT_DB_DRIVER: mysql
      EXPECT_DB_VERSION: '^11\.4\.2-MariaDB'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pharmacy_testing
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      DB_STRICT_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.3-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Environment
        run: cp .env.example .env
      - name: Wallet tests with the database connection in strict mode
        # Its own job because tests/Feature/Wallet starts from an empty database: inside the serial run above it had to go LAST, and
        # the two together outgrew that job's 110 minutes -- run 651 was cancelled at exactly that, after 91 and 67 minutes in the two
        # runs before it. Apart, each half has its own budget and its own database, so the ordering that constraint imposed is not
        # needed at all.
        run: vendor/bin/phpunit -c phpunit.mysql.xml tests/Feature/Wallet --display-skipped
